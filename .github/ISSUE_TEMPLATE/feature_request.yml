name: Feature request
description: Suggest something new or a change to how something works.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation in the gym or in the app where you miss this.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: offline
    attributes:
      label: Fits the app's promises
      options:
        - label: This works offline and needs no account
          required: true
