name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. Please search existing issues first.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Home tab
        2. Tap Start workout
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About shows it.
      placeholder: "1.0 (1)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: "iPhone 18 Pro, iOS 27.1"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Drag images or recordings here. Remove any personal data first.
