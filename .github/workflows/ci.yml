name: CI

# Build and tests run on Xcode Cloud: GymBro targets iOS 27, and GitHub's hosted macOS runners
# don't ship Xcode 27 yet. This workflow only runs the checks that don't need Xcode.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manifest:
    name: Package manifest
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7
      - name: Parse Package.swift
        working-directory: GymBroPackage
        run: swift package dump-package > /dev/null

  format:
    name: Format check
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7
      - name: swift format lint
        run: swift format lint --strict --recursive GymBroPackage/Sources GymBroPackage/Tests

  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:latest
    # Non-blocking until existing warnings are cleaned up.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: swiftlint
        working-directory: GymBroPackage
        run: swiftlint lint --reporter github-actions-logging
