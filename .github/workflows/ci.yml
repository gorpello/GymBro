name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27"

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('GymBroPackage/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS-27' in k for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: |
          xcodebuild build \
            -workspace GymBroWorkspace.xcworkspace \
            -scheme GymBro \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Run package tests
        working-directory: GymBroPackage
        run: |
          xcodebuild test \
            -scheme GymBroPackage-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

  format:
    name: Format check
    runs-on: macos-26
    # Non-blocking until the codebase has had its first full `swift format` pass.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27"
      - name: swift format lint
        run: swift format lint --strict --recursive GymBroPackage/Sources GymBroPackage/Tests
