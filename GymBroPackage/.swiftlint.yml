# SwiftLint flags code smells while you build. Layout (indentation, wrapping, commas,
# whitespace, import order) belongs to swift-format (`.swift-format` at the repo root),
# so the rules that would fight it are turned off here.

included:
  - Sources
  - Tests

excluded:
  - .build
  - Sources/Database/PreviewData.swift
  - Sources/Database/Schema.swift
  - Sources/L10n/L10n.swift   # converted from the Android ARB files; one accessor per key

# MARK: - Owned by swift-format

disabled_rules:
  - closing_brace
  - colon
  - comma
  - leading_whitespace
  - opening_brace
  - function_name_whitespace
  - return_arrow_whitespace
  - statement_position
  - trailing_comma
  - trailing_newline
  - trailing_whitespace
  - vertical_parameter_alignment
  - vertical_whitespace
  - large_tuple

# MARK: - Extra checks

opt_in_rules:
  - array_init
  - closure_spacing
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - last_where
  - legacy_multiple
  - modifier_order
  - overridden_super_call
  - prefer_self_in_static_references
  - private_swiftui_state
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - yoda_condition

# MARK: - Thresholds

line_length:
  warning: 120
  error: 160
  ignores_urls: true
  ignores_comments: true

# SwiftUI bodies and TCA reducers are long by nature.
function_body_length:
  warning: 80
  error: 150

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 1000

# A reducer is one big switch over actions; each case is simple.
cyclomatic_complexity:
  warning: 15
  error: 25
  ignores_case_statements: true

# TCA nests State, Action and Delegate inside the reducer.
nesting:
  type_level: 3

identifier_name:
  min_length:
    warning: 2
  excluded: [i, x, y, id, db, to, ok]

reporter: xcode
